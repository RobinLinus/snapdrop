[package]
name = "snapdrop-server"
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
serde = { version = "1.0", features = ["derive"] }
rmp-serde = "1.3"
serde_bytes = "0.11"
uuid = { version = "1.23", features = ["v4", "serde"] }
ipnet = "2"

[profile.release]
lto = "thin"
strip = true
